<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>候选3 · 暮色剪影 · 正对跑道双机分航</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38225e"/>
      <stop offset="0.38" stop-color="#8e3b6e"/>
      <stop offset="0.62" stop-color="#e2683f"/>
      <stop offset="0.8" stop-color="#f9a03f"/>
      <stop offset="1" stop-color="#ffd88a"/>
    </linearGradient>
    <path id="jet" d="M85,0 C80,-6 60,-9 40,-9 L-44,-9 L-68,-34 L-78,-34 L-72,-7 L-80,-2 L-80,3 L-62,8 L25,9 C55,9 76,6 85,0 Z M22,3 L-22,30 L-40,30 L-4,3 Z M14,-8 L-14,-26 L-30,-26 L-4,-8 Z M-58,2 L-74,16 L-84,16 L-68,2 Z M0,12 L30,12 L30,21 L0,21 Z"/>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#dusk)"/>

  <!-- thin dusk clouds -->
  <rect x="52" y="96" width="140" height="12" rx="6" fill="#ffd9a0" opacity="0.35"/>
  <rect x="330" y="70" width="120" height="11" rx="5.5" fill="#ffd9a0" opacity="0.3"/>
  <rect x="404" y="130" width="90" height="10" rx="5" fill="#ffd9a0" opacity="0.3"/>

  <!-- sun sitting right on the runway far end -->
  <circle cx="256" cy="196" r="64" fill="#ff9d4d" opacity="0.3"/>
  <circle cx="256" cy="196" r="42" fill="#ffdf8e"/>

  <!-- skyline silhouettes -->
  <g fill="#171226">
    <rect x="48" y="224" width="96" height="22"/>
    <rect x="330" y="226" width="120" height="20"/>
    <rect x="410" y="206" width="10" height="40"/>
    <path d="M400,206 L430,206 L424,192 L406,192 Z"/>
    <rect x="414" y="180" width="2.5" height="12"/>
  </g>
  <circle cx="415" cy="178" r="2.5" fill="#ffca7a"/>
  <g fill="#ffca7a" opacity="0.85">
    <rect x="60" y="230" width="7" height="6" rx="1"/>
    <rect x="76" y="230" width="7" height="6" rx="1"/>
    <rect x="92" y="230" width="7" height="6" rx="1"/>
    <rect x="108" y="230" width="7" height="6" rx="1"/>
    <rect x="124" y="230" width="7" height="6" rx="1"/>
    <rect x="344" y="231" width="7" height="6" rx="1"/>
    <rect x="362" y="231" width="7" height="6" rx="1"/>
    <rect x="380" y="231" width="7" height="6" rx="1"/>
    <rect x="398" y="231" width="7" height="6" rx="1"/>
  </g>

  <!-- ground -->
  <rect x="0" y="246" width="512" height="266" fill="#241b3f"/>

  <!-- runway in perspective -->
  <path d="M96,512 L244,252 L268,252 L416,512 Z" fill="#171226"/>
  <g stroke="#cbd5e1" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="470" x2="256" y2="500" stroke-width="8"/>
    <line x1="256" y1="428" x2="256" y2="454" stroke-width="6.5"/>
    <line x1="256" y1="392" x2="256" y2="414" stroke-width="6"/>
    <line x1="256" y1="362" x2="256" y2="380" stroke-width="5"/>
    <line x1="256" y1="336" x2="256" y2="350" stroke-width="4"/>
    <line x1="256" y1="314" x2="256" y2="324" stroke-width="3.2"/>
    <line x1="256" y1="296" x2="256" y2="303" stroke-width="2.6"/>
    <line x1="256" y1="281" x2="256" y2="287" stroke-width="2"/>
  </g>

  <!-- runway edge lights converging to the far end -->
  <g>
    <circle cx="114" cy="481" r="4" fill="#ffb84d"/><circle cx="132" cy="450" r="3.5" fill="#ffe9b0"/>
    <circle cx="149" cy="418" r="3" fill="#ffb84d"/><circle cx="167" cy="387" r="2.7" fill="#ffe9b0"/>
    <circle cx="185" cy="356" r="2.3" fill="#ffb84d"/><circle cx="202" cy="325" r="2" fill="#ffe9b0"/>
    <circle cx="220" cy="293" r="1.7" fill="#ffb84d"/>
    <circle cx="398" cy="481" r="4" fill="#ffe9b0"/><circle cx="380" cy="450" r="3.5" fill="#ffb84d"/>
    <circle cx="363" cy="418" r="3" fill="#ffe9b0"/><circle cx="345" cy="387" r="2.7" fill="#ffb84d"/>
    <circle cx="327" cy="356" r="2.3" fill="#ffe9b0"/><circle cx="310" cy="325" r="2" fill="#ffb84d"/>
    <circle cx="292" cy="293" r="1.7" fill="#ffe9b0"/>
  </g>

  <!-- white trajectories from runway end -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M256,257 C300,236 322,204 331,167"/>
    <path d="M256,257 C230,248 206,238 185,221"/>
  </g>
  <circle cx="256" cy="257" r="5" fill="#ffffff"/>

  <!-- planes: dark silhouettes with warm rim light -->
  <use href="#jet" xlink:href="#jet" transform="translate(388,148) rotate(-10) scale(0.8)" fill="#241b3f" stroke="#ffca7a" stroke-width="2.5"/>
  <use href="#jet" xlink:href="#jet" transform="translate(128,208) scale(-0.68,0.68) rotate(-8)" fill="#241b3f" stroke="#ffca7a" stroke-width="2.8"/>
</svg>
