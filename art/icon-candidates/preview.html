<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ProxyDirector 图标 · 暗色雷达 · 加粗版预览</title>
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#eef2f7;margin:0;padding:28px;color:#1e293b}
  h1{font-size:20px;margin:0 0 6px}
  p.tip{color:#64748b;font-size:13px;margin:0 0 20px}
  .row{display:flex;flex-wrap:wrap;gap:20px}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.08)}
  .card h2{font-size:15px;margin:0 0 4px}
  .card p{font-size:12.5px;color:#64748b;margin:0 0 12px}
  img.big{width:260px;height:260px;display:block}
  .ladder{display:flex;align-items:flex-end;gap:16px;margin-top:4px}
  .ladder figure{margin:0;text-align:center}
  .ladder img{display:block;margin:0 auto 4px}
  .ladder figcaption{font-size:11px;color:#94a3b8}
  .dark{background:#0f172a;border-radius:10px;padding:8px;display:inline-block}
</style>
</head>
<body>
<h1>ProxyDirector 图标 · 暗色雷达 · 加粗版(当前已内嵌 exe)</h1>
<p class="tip">上排为完整版(ICO 的 48/64/128/256 帧由它生成):跑道边线、中线、入口斑马线、航迹全面加粗,飞机放大并加同色描边。下排为小尺寸极简帧(ICO 的 16/24/32 帧专用):去掉雷达环以外的细碎元素,超粗分叉线 + 放大双机,保证缩小后仍可辨认。</p>
<div class="row">

  <div class="card">
    <h2>完整版(icon-c2-radar-dark.svg)</h2>
    <p>48px 及以上使用</p>
    <img class="big" src="icon-c2-radar-dark.svg" alt="完整版">
    <div class="ladder">
      <figure><img src="icon-c2-radar-dark.svg" width="128" height="128" alt=""><figcaption>128</figcaption></figure>
      <figure><img src="icon-c2-radar-dark.svg" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
      <figure><img src="icon-c2-radar-dark.svg" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
      <figure><span class="dark"><img src="icon-c2-radar-dark.svg" width="48" height="48" alt=""></span><figcaption>深色任务栏 48</figcaption></figure>
    </div>
  </div>

  <div class="card">
    <h2>小尺寸极简帧(icon-c2-radar-small.svg)</h2>
    <p>32/24/16 帧使用,托盘与标题栏实际观感</p>
    <img class="big" src="icon-c2-radar-small.svg" alt="极简版">
    <div class="ladder">
      <figure><img src="icon-c2-radar-small.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      <figure><img src="icon-c2-radar-small.svg" width="24" height="24" alt=""><figcaption>24</figcaption></figure>
      <figure><img src="icon-c2-radar-small.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
      <figure><span class="dark"><img src="icon-c2-radar-small.svg" width="24" height="24" alt=""></span><figcaption>深色托盘 24</figcaption></figure>
    </div>
  </div>

</div>
</body>
</html>
