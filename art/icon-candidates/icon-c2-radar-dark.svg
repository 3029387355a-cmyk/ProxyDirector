  <rect x="0" y="246" width="512" height="266" fill="#0d1526"/>
  <path d="M96,512 L244,252 L268,252 L416,512 Z" fill="#101a2e"/>
  <line x1="104" y1="504" x2="246" y2="258" stroke="#38bdf8" stroke-width="11" opacity="0.18"/>
  <line x1="104" y1="504" x2="246" y2="258" stroke="#a5e6ff" stroke-width="5.5" opacity="0.9"/>
  <line x1="408" y1="504" x2="266" y2="258" stroke="#38bdf8" stroke-width="11" opacity="0.18"/>
  <line x1="408" y1="504" x2="266" y2="258" stroke="#a5e6ff" stroke-width="5.5" opacity="0.9"/>
  <line x1="244" y1="252" x2="268" y2="252" stroke="#a5e6ff" stroke-width="6"/>
  <g stroke="#a5e6ff" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="468" x2="256" y2="502" stroke-width="16"/>
    <line x1="256" y1="416" x2="256" y2="448" stroke-width="13"/>
    <line x1="256" y1="372" x2="256" y2="400" stroke-width="11"/>
    <line x1="256" y1="334" x2="256" y2="358" stroke-width="9"/>
    <line x1="256" y1="302" x2="256" y2="322" stroke-width="7"/>
    <line x1="256" y1="278" x2="256" y2="294" stroke-width="6"/>
  </g>
  <g fill="#a5e6ff" opacity="0.9">
    <rect x="104" y="486" width="34" height="26"/>
    <rect x="160" y="486" width="34" height="26"/>
    <rect x="215" y="486" width="34" height="26"/>
    <rect x="271" y="486" width="34" height="26"/>
    <rect x="326" y="486" width="34" height="26"/>
    <rect x="382" y="486" width="34" height="26"/>
  </g>

  <!-- white trajectories from runway end (bold) -->
  <g fill="none" stroke-linecap="round">
    <path d="M256,257 C298,236 312,200 318,166" stroke="#ffffff" stroke-width="22" opacity="0.2"/>
    <path d="M256,257 C298,236 312,200 318,166" stroke="#ffffff" stroke-width="10"/>
    <path d="M256,257 C230,248 206,236 190,220" stroke="#ffffff" stroke-width="22" opacity="0.2"/>
    <path d="M256,257 C230,248 206,236 190,220" stroke="#ffffff" stroke-width="10"/>
  </g>
  <circle cx="256" cy="257" r="9" fill="#ffffff"/>

  <!-- planes: enlarged + fattened with same-color stroke -->
  <use href="#jet" xlink:href="#jet" transform="translate(388,148) rotate(-10) scale(0.95)" fill="#22d3ee" stroke="#22d3ee" stroke-width="10" stroke-linejoin="round"/>
  <use href="#jet" xlink:href="#jet" transform="translate(128,208) scale(-0.82,0.82) rotate(-8)" fill="#fbbf24" stroke="#fbbf24" stroke-width="10" stroke-linejoin="round"/>

  </g>
</svg>
