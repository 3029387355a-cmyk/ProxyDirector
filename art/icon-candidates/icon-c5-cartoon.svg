<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>候选5 · 清新卡通 · 正对跑道双机分航</title>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee0b8"/>
      <stop offset="1" stop-color="#e2f7ec"/>
    </linearGradient>
    <linearGradient id="grassC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e08b"/>
      <stop offset="1" stop-color="#3fbf6b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#mint)"/>

  <!-- sun -->
  <circle cx="448" cy="72" r="48" fill="#ffe9a3" opacity="0.55"/>
  <circle cx="448" cy="72" r="34" fill="#ffd93d"/>

  <!-- chunky clouds -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="92" cy="120" r="20"/>
    <circle cx="120" cy="108" r="26"/>
    <circle cx="148" cy="122" r="18"/>
    <rect x="74" y="120" width="94" height="18" rx="9"/>
    <circle cx="320" cy="92" r="14"/>
    <circle cx="342" cy="82" r="18"/>
    <circle cx="362" cy="94" r="12"/>
    <rect x="306" y="92" width="68" height="14" rx="7"/>
  </g>

  <!-- skyline on horizon -->
  <g>
    <rect x="54" y="224" width="96" height="22" rx="6" fill="#c7f0e2" stroke="#8fd9bd" stroke-width="3"/>
    <rect x="410" y="200" width="12" height="46" rx="4" fill="#bfe8d6"/>
    <rect x="402" y="190" width="28" height="16" rx="6" fill="#bfe8d6" stroke="#8fd9bd" stroke-width="3"/>
    <line x1="416" y1="190" x2="416" y2="174" stroke="#8fd9bd" stroke-width="3"/>
    <circle cx="416" cy="171" r="4" fill="#f97316"/>
  </g>

  <!-- ground -->
  <rect x="0" y="246" width="512" height="266" fill="url(#grassC)"/>
  <rect x="0" y="330" width="512" height="13" fill="#4bc97c" opacity="0.4"/>
  <rect x="0" y="420" width="512" height="15" fill="#4bc97c" opacity="0.4"/>

  <!-- runway in perspective -->
  <path d="M96,512 L244,252 L268,252 L416,512 Z" fill="#f4f7fb" stroke="#c9d6e4" stroke-width="4"/>
  <g stroke="#b7c6d6" stroke-linecap="round">
    <line x1="256" y1="470" x2="256" y2="500" stroke-width="10"/>
    <line x1="256" y1="428" x2="256" y2="454" stroke-width="8"/>
    <line x1="256" y1="392" x2="256" y2="414" stroke-width="7"/>
    <line x1="256" y1="362" x2="256" y2="380" stroke-width="6"/>
    <line x1="256" y1="336" x2="256" y2="350" stroke-width="5"/>
    <line x1="256" y1="314" x2="256" y2="324" stroke-width="4"/>
    <line x1="256" y1="296" x2="256" y2="303" stroke-width="3"/>
    <line x1="256" y1="281" x2="256" y2="287" stroke-width="2.5"/>
  </g>
  <g fill="#c3d2e0">
    <rect x="106" y="494" width="24" height="18" rx="4"/>
    <rect x="146" y="494" width="24" height="18" rx="4"/>
    <rect x="186" y="494" width="24" height="18" rx="4"/>
    <rect x="226" y="494" width="24" height="18" rx="4"/>
    <rect x="266" y="494" width="24" height="18" rx="4"/>
    <rect x="306" y="494" width="24" height="18" rx="4"/>
    <rect x="346" y="494" width="24" height="18" rx="4"/>
    <rect x="386" y="494" width="24" height="18" rx="4"/>
  </g>

  <!-- white dotted trajectories from runway end -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="0.1 17">
    <path d="M256,257 C300,236 318,200 344,166"/>
    <path d="M256,257 C230,248 200,234 170,221"/>
  </g>
  <circle cx="256" cy="257" r="7" fill="#ffffff"/>

  <!-- front plane: orange, flying right -->
  <g transform="translate(388,148) rotate(-10) scale(0.8)">
    <path d="M8,-12 L-12,-28 Q-16,-32 -19,-26 L-4,-12 Z" fill="#ea7318"/>
    <path d="M-26,-12 L-38,-33 Q-40,-37 -45,-36 L-49,-12 Z" fill="#ea7318"/>
    <path d="M66,0 Q60,-12 42,-12 L-40,-12 Q-56,-12 -56,-1 Q-56,10 -40,10 L42,10 Q60,10 66,0 Z" fill="#fb923c"/>
    <path d="M16,2 L-12,27 Q-20,32 -23,24 L-2,0 Z" fill="#ea7318"/>
    <rect x="-2" y="9" width="24" height="10" rx="5" fill="#9a4b12"/>
    <circle cx="34" cy="-4" r="3.2" fill="#7c2d12"/>
    <circle cx="18" cy="-4" r="3.2" fill="#7c2d12"/>
    <circle cx="2" cy="-4" r="3.2" fill="#7c2d12"/>
    <path d="M50,-9 Q59,-7 64,-3 L50,-3 Z" fill="#7c2d12"/>
  </g>

  <!-- rear plane: teal, flying left -->
  <g transform="translate(128,208) scale(-0.68,0.68) rotate(-8)">
    <path d="M8,-12 L-12,-28 Q-16,-32 -19,-26 L-4,-12 Z" fill="#14b8a6"/>
    <path d="M-26,-12 L-38,-33 Q-40,-37 -45,-36 L-49,-12 Z" fill="#14b8a6"/>
    <path d="M66,0 Q60,-12 42,-12 L-40,-12 Q-56,-12 -56,-1 Q-56,10 -40,10 L42,10 Q60,10 66,0 Z" fill="#2dd4bf"/>
    <path d="M16,2 L-12,27 Q-20,32 -23,24 L-2,0 Z" fill="#14b8a6"/>
    <rect x="-2" y="9" width="24" height="10" rx="5" fill="#0f766e"/>
    <circle cx="34" cy="-4" r="3.2" fill="#134e4a"/>
    <circle cx="18" cy="-4" r="3.2" fill="#134e4a"/>
    <circle cx="2" cy="-4" r="3.2" fill="#134e4a"/>
    <path d="M50,-9 Q59,-7 64,-3 L50,-3 Z" fill="#134e4a"/>
  </g>
</svg>
