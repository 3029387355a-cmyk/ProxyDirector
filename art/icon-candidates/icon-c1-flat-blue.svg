<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>候选1 · 现代扁平 · 正对跑道双机分航</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="0.6" stop-color="#4f92f0"/>
      <stop offset="1" stop-color="#a8d4fb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ac74f"/>
      <stop offset="1" stop-color="#4e9a3a"/>
    </linearGradient>
    <path id="jet" d="M85,0 C80,-6 60,-9 40,-9 L-44,-9 L-68,-34 L-78,-34 L-72,-7 L-80,-2 L-80,3 L-62,8 L25,9 C55,9 76,6 85,0 Z M22,3 L-22,30 L-40,30 L-4,3 Z M14,-8 L-14,-26 L-30,-26 L-4,-8 Z M-58,2 L-74,16 L-84,16 L-68,2 Z M0,12 L30,12 L30,21 L0,21 Z"/>
    <g id="cloud">
      <circle cx="-26" cy="0" r="16"/>
      <circle cx="0" cy="-10" r="20"/>
      <circle cx="26" cy="0" r="15"/>
      <rect x="-40" y="0" width="80" height="14" rx="7"/>
    </g>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#sky)"/>

  <use href="#cloud" xlink:href="#cloud" x="118" y="86" fill="#ffffff" opacity="0.55"/>
  <use href="#cloud" xlink:href="#cloud" transform="translate(420,64) scale(0.6)" fill="#ffffff" opacity="0.45"/>
  <use href="#cloud" xlink:href="#cloud" transform="translate(66,178) scale(0.45)" fill="#ffffff" opacity="0.4"/>

  <!-- skyline on horizon -->
  <g fill="#5b6b7f">
    <rect x="60" y="226" width="90" height="20" rx="3"/>
    <rect x="352" y="228" width="110" height="18" rx="3"/>
    <rect x="416" y="204" width="8" height="42"/>
    <path d="M408,204 L432,204 L428,192 L412,192 Z"/>
  </g>

  <!-- ground -->
  <rect x="0" y="246" width="512" height="266" fill="url(#grass)"/>

  <!-- runway in perspective -->
  <path d="M96,512 L244,252 L268,252 L416,512 Z" fill="#3f4a5a"/>
  <line x1="104" y1="504" x2="246" y2="258" stroke="#f8fafc" stroke-width="3" opacity="0.7"/>
  <line x1="408" y1="504" x2="266" y2="258" stroke="#f8fafc" stroke-width="3" opacity="0.7"/>
  <line x1="244" y1="252" x2="268" y2="252" stroke="#f8fafc" stroke-width="3"/>
  <g stroke="#f8fafc" stroke-linecap="round">
    <line x1="256" y1="470" x2="256" y2="500" stroke-width="10"/>
    <line x1="256" y1="428" x2="256" y2="454" stroke-width="8"/>
    <line x1="256" y1="392" x2="256" y2="414" stroke-width="7"/>
    <line x1="256" y1="362" x2="256" y2="380" stroke-width="6"/>
    <line x1="256" y1="336" x2="256" y2="350" stroke-width="5"/>
    <line x1="256" y1="314" x2="256" y2="324" stroke-width="4"/>
    <line x1="256" y1="296" x2="256" y2="303" stroke-width="3"/>
    <line x1="256" y1="281" x2="256" y2="287" stroke-width="2.5"/>
  </g>
  <g fill="#f8fafc">
    <rect x="106" y="494" width="24" height="18"/>
    <rect x="146" y="494" width="24" height="18"/>
    <rect x="186" y="494" width="24" height="18"/>
    <rect x="226" y="494" width="24" height="18"/>
    <rect x="266" y="494" width="24" height="18"/>
    <rect x="306" y="494" width="24" height="18"/>
    <rect x="346" y="494" width="24" height="18"/>
    <rect x="386" y="494" width="24" height="18"/>
  </g>

  <!-- white trajectories from runway end, forking left/right -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M256,257 C300,236 322,204 331,167"/>
    <path d="M256,257 C230,248 206,238 185,221"/>
  </g>
  <circle cx="256" cy="257" r="5" fill="#ffffff"/>

  <!-- planes: front (up-right), rear (up-left) -->
  <use href="#jet" xlink:href="#jet" transform="translate(388,148) rotate(-10) scale(0.8)" fill="#ffffff"/>
  <use href="#jet" xlink:href="#jet" transform="translate(128,208) scale(-0.68,0.68) rotate(-8)" fill="#ffffff"/>
</svg>
